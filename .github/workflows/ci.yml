name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 1: Lint · Typecheck · Build · Unit Tests ────────────────────────────
  unit:
    name: Lint · Typecheck · Build · Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - name: Restore NX cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-${{ runner.os }}-

      - run: npx nx run-many -t lint --nx-bail

      - run: npx nx run-many -t typecheck --nx-bail

      - run: npx nx run-many -t build --nx-bail

      - run: npx nx run-many -t test --coverage --nx-bail

      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs coverage/unit >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage/unit/
          retention-days: 1

      - run: npx nx fix-ci
        if: always()

  # ── Job 2: Integration & E2E Tests ────────────────────────────────────────
  # Runs only after unit passes. Spins up Postgres, Redis, and LocalStack
  # (SQS) via docker-compose.test.yml, runs migrations, then executes all
  # e2e suites. Add future e2e projects as extra steps in this job.
  integration:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Start test infrastructure ───────────────────────────────────────
      - name: Start test containers
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for PostgreSQL (business)
        run: |
          until docker compose -f docker-compose.test.yml exec -T postgres-test pg_isready -U postgres -d saas_test; do echo "Waiting for business DB..."; sleep 2; done

      - name: Wait for PostgreSQL (legal)
        run: |
          until docker compose -f docker-compose.test.yml exec -T postgres-legal-test pg_isready -U postgres -d legal_test; do echo "Waiting for legal DB..."; sleep 2; done

      - name: Wait for Redis
        run: |
          until docker compose -f docker-compose.test.yml exec -T redis-test redis-cli ping; do echo "Waiting for Redis..."; sleep 2; done

      - name: Wait for LocalStack
        run: |
          until curl -sf http://localhost:4567/_localstack/health | grep -q '"sqs": *"available"'; do echo "Waiting for LocalStack SQS..."; sleep 3; done

      # ── Generate Prisma clients ─────────────────────────────────────────
      - name: Generate Prisma clients
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost/dummy
          LEGAL_AUDIT_DATABASE_URL: postgresql://dummy:dummy@localhost/dummy
        run: |
          npx prisma generate
          npx prisma generate --config prisma.config.legal.ts

      # ── Run migrations ──────────────────────────────────────────────────
      # DATABASE_URL here is the superuser/owner role — required for
      # ALTER TABLE ... ENABLE ROW LEVEL SECURITY / CREATE POLICY (see
      # prisma/migrations/20260808120000_enable_row_level_security).
      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5440/saas_test
          LEGAL_AUDIT_DATABASE_URL: postgresql://postgres:postgres@localhost:5441/legal_test
        run: |
          npx prisma migrate deploy
          npx prisma migrate deploy --config prisma.config.legal.ts

      # ── Provision app_runtime / app_admin_runtime role passwords ────────
      - name: Provision runtime DB roles
        run: node scripts/provision-runtime-roles.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5440/saas_test
          APP_RUNTIME_DB_PASSWORD: ci-app-runtime-pw
          APP_ADMIN_RUNTIME_DB_PASSWORD: ci-app-admin-runtime-pw

      # ── RLS policy drift check ───────────────────────────────────────────
      # Fails the build if a tenant-scoped table (org_id column, or a known
      # FK/root-scoped table) is missing Row-Level Security or a policy.
      - name: Verify RLS policies
        run: npm run verify:rls
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5440/saas_test

      # ── E2E suites ──────────────────────────────────────────────────────
      # api-e2e / worker-a-e2e connect as app_runtime (RLS-subject) — the
      # same role apps/api and apps/worker-a use in production, so RLS is
      # genuinely exercised through real request/job paths, not bypassed.
      - name: E2E — api-e2e
        run: npx nx e2e api-e2e --coverage
        env:
          NODE_ENV: test
          MIGRATE_DATABASE_URL: postgresql://postgres:postgres@localhost:5440/saas_test
          DATABASE_URL: postgresql://app_runtime:ci-app-runtime-pw@localhost:5440/saas_test
          LEGAL_AUDIT_DATABASE_URL: postgresql://postgres:postgres@localhost:5441/legal_test
          REDIS_HOST: localhost
          REDIS_PORT: 6380
          REDIS_PASSWORD: ''
          AUTH0_DOMAIN: test.auth0.local
          AUTH0_AUDIENCE: https://api.test.local
          EVENT_BUS_TRANSPORT: local
          PORT: '0'

      # admin-api connects as app_admin_runtime (BYPASSRLS) — it legitimately
      # needs cross-org access (see apps/admin-api/src/main.ts).
      - name: E2E — admin-api-e2e
        run: npx nx e2e admin-api-e2e --coverage
        env:
          NODE_ENV: test
          MIGRATE_DATABASE_URL: postgresql://postgres:postgres@localhost:5440/saas_test
          DATABASE_URL: postgresql://app_admin_runtime:ci-app-admin-runtime-pw@localhost:5440/saas_test
          LEGAL_AUDIT_DATABASE_URL: postgresql://postgres:postgres@localhost:5441/legal_test
          REDIS_HOST: localhost
          REDIS_PORT: 6380
          REDIS_PASSWORD: ''
          AUTH0_DOMAIN: test.auth0.local
          AUTH0_AUDIENCE: https://api.test.local
          EVENT_BUS_TRANSPORT: local
          PORT: '0'

      - name: E2E — worker-a-e2e
        run: npx nx e2e worker-a-e2e --coverage
        env:
          NODE_ENV: test
          MIGRATE_DATABASE_URL: postgresql://postgres:postgres@localhost:5440/saas_test
          DATABASE_URL: postgresql://app_runtime:ci-app-runtime-pw@localhost:5440/saas_test
          LEGAL_AUDIT_DATABASE_URL: postgresql://postgres:postgres@localhost:5441/legal_test
          REDIS_HOST: localhost
          REDIS_PORT: 6380
          REDIS_PASSWORD: ''
          AUTH0_DOMAIN: test.auth0.local
          AUTH0_AUDIENCE: https://api.test.local
          EVENT_BUS_TRANSPORT: local
          SQS_STANDARD_QUEUE_URL: http://localhost:4567/000000000000/saas-backend-heavy-jobs
          SQS_FIFO_QUEUE_URL: http://localhost:4567/000000000000/saas-backend-billing-events.fifo
          SQS_ENDPOINT_URL: http://localhost:4567
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          PORT: '0'

      # ── Lib integration tests ───────────────────────────────────────────
      - name: Integration — email lib
        run: npx nx run email:test-integration --coverage=false
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5440/saas_test
          LEGAL_AUDIT_DATABASE_URL: postgresql://postgres:postgres@localhost:5441/legal_test
          EMAIL_PROVIDER: resend
          EMAIL_FROM_ADDRESS: noreply@test.example.com
          EMAIL_FROM_NAME: Test Platform
          RESEND_API_KEY: re_test_placeholder

      # Add future e2e suites here following the same pattern:
      # - name: E2E — <new-app>-e2e
      #   run: npx nx e2e <new-app>-e2e
      #   env: ...

      - name: Upload integration coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-integration
          path: coverage/integration/
          retention-days: 1

      # ── Teardown ────────────────────────────────────────────────────────
      - name: Teardown test containers
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # ── Job 3: SonarQube Analysis ──────────────────────────────────────────────
  # Runs after all tests pass. Receives unit-test coverage artifacts and sends
  # a full static-analysis + coverage report to SonarCloud.
  # Required secrets: SONAR_TOKEN, SONAR_HOST_URL
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Disable shallow clone for accurate blame and new-code detection
          fetch-depth: 0

      - name: Download unit coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit/

      - name: Download integration coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration
          path: coverage/integration/

      # No path-rewrite needed: sonarqube-scan-action@v6 runs the scanner
      # natively on the runner (not inside Docker). $GITHUB_WORKSPACE is
      # identical in both the unit job and this job, so the absolute SF:
      # paths in the lcov files already match the source tree here.

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Setup Node.js for coverage script
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Generate coverage PR comment
        if: always() && github.event_name == 'pull_request'
        run: node scripts/coverage-summary.mjs > coverage-comment.md

      - name: Post coverage PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage-comment.md
