name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 1: Lint · Unit Tests · Build ──────────────────────────────────────
  unit:
    name: Lint · Unit Tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - run: npx nx run-many -t lint

      - run: npx nx run-many -t typecheck

      - run: npx nx run-many -t build

      - run: npx nx run-many -t test --coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage/unit/
          retention-days: 1

      - run: npx nx fix-ci
        if: always()

  # ── Job 2: Integration & E2E Tests ────────────────────────────────────────
  # Runs only after unit passes. Spins up Postgres, Redis, and LocalStack
  # (SQS) via docker-compose.test.yml, runs migrations, then executes all
  # e2e suites. Add future e2e projects as extra steps in this job.
  integration:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Start test infrastructure ───────────────────────────────────────
      - name: Start test containers
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for PostgreSQL (business)
        run: |
          until docker compose -f docker-compose.test.yml exec -T postgres-test \
            pg_isready -U postgres -d saas_test; do
            echo "Waiting for business DB..."
            sleep 2
          done

      - name: Wait for PostgreSQL (legal)
        run: |
          until docker compose -f docker-compose.test.yml exec -T postgres-legal-test \
            pg_isready -U postgres -d legal_test; do
            echo "Waiting for legal DB..."
            sleep 2
          done

      - name: Wait for Redis
        run: |
          until docker compose -f docker-compose.test.yml exec -T redis-test \
            redis-cli ping; do
            echo "Waiting for Redis..."
            sleep 2
          done

      - name: Wait for LocalStack
        run: |
          until curl -sf http://localhost:4567/_localstack/health | grep -q '"sqs": *"available"'; do
            echo "Waiting for LocalStack SQS..."
            sleep 3
          done

      # ── Generate Prisma clients ─────────────────────────────────────────
      - name: Generate Prisma clients
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma generate --schema=prisma/schema.legal.prisma

      # ── Run migrations ──────────────────────────────────────────────────
      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5440/saas_test
          LEGAL_AUDIT_DATABASE_URL: postgresql://postgres:postgres@localhost:5441/legal_test
        run: |
          npx prisma migrate deploy --schema=prisma/schema.prisma
          npx prisma migrate deploy --schema=prisma/schema.legal.prisma

      # ── E2E suites ──────────────────────────────────────────────────────
      - name: E2E — api-e2e
        run: npx nx e2e api-e2e
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5440/saas_test
          LEGAL_AUDIT_DATABASE_URL: postgresql://postgres:postgres@localhost:5441/legal_test
          REDIS_HOST: localhost
          REDIS_PORT: 6380
          REDIS_PASSWORD: ''
          AUTH0_DOMAIN: test.auth0.local
          AUTH0_AUDIENCE: https://api.test.local
          EVENT_BUS_TRANSPORT: local
          PORT: '0'

      - name: E2E — worker-a-e2e
        run: npx nx e2e worker-a-e2e
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5440/saas_test
          LEGAL_AUDIT_DATABASE_URL: postgresql://postgres:postgres@localhost:5441/legal_test
          REDIS_HOST: localhost
          REDIS_PORT: 6380
          REDIS_PASSWORD: ''
          AUTH0_DOMAIN: test.auth0.local
          AUTH0_AUDIENCE: https://api.test.local
          EVENT_BUS_TRANSPORT: local
          SQS_STANDARD_QUEUE_URL: http://localhost:4567/000000000000/saas-backend-heavy-jobs
          SQS_FIFO_QUEUE_URL: http://localhost:4567/000000000000/saas-backend-billing-events.fifo
          SQS_ENDPOINT_URL: http://localhost:4567
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          PORT: '0'

      # ── Lib integration tests ───────────────────────────────────────────
      - name: Integration — email lib
        run: npx nx test email -- --testPathPattern='\.integration\.spec\.ts$' --coverage=false
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5440/saas_test
          LEGAL_AUDIT_DATABASE_URL: postgresql://postgres:postgres@localhost:5441/legal_test
          EMAIL_PROVIDER: sendgrid
          EMAIL_FROM_ADDRESS: noreply@test.example.com
          EMAIL_FROM_NAME: Test Platform
          SENDGRID_API_KEY: SG.test_placeholder

      # Add future e2e suites here following the same pattern:
      # - name: E2E — <new-app>-e2e
      #   run: npx nx e2e <new-app>-e2e
      #   env: ...

      # ── Teardown ────────────────────────────────────────────────────────
      - name: Teardown test containers
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # ── Job 3: SonarQube Analysis ──────────────────────────────────────────────
  # Runs after all tests pass. Receives unit-test coverage artifacts and sends
  # a full static-analysis + coverage report to SonarCloud.
  # Required secrets: SONAR_TOKEN, SONAR_HOST_URL
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Disable shallow clone for accurate blame and new-code detection
          fetch-depth: 0

      - name: Download unit coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit/

      # No path-rewrite needed: sonarqube-scan-action@v6 runs the scanner
      # natively on the runner (not inside Docker). $GITHUB_WORKSPACE is
      # identical in both the unit job and this job, so the absolute SF:
      # paths in the lcov files already match the source tree here.

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
