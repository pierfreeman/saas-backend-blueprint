version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sports-intelligence-backend-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sports_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sports-intelligence-backend-network

  redis:
    image: redis:7-alpine
    container_name: sports-intelligence-backend-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sports-intelligence-backend-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sports-intelligence-backend-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://user:password@postgres:5432/sports_intelligence?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis
    networks:
      - sports-intelligence-backend-network

volumes:
  postgres_data:
  redis_data:

networks:
  sports-intelligence-backend-network:
    driver: bridge
