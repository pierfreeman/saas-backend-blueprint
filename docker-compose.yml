services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-saas_backend}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-saas_backend}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── PostgreSQL (Legal Audit DB) ──────────────────────────────────────────────
  postgres-legal:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_LEGAL_DB:-saas_legal_audit}
    ports:
      - '${POSTGRES_LEGAL_PORT:-5434}:5432'
    volumes:
      - postgres_legal_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_LEGAL_DB:-saas_legal_audit}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_HOST_PORT:-6380}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── LocalStack (SQS) ──────────────────────────────────────────────────────────
  localstack:
    image: localstack/localstack:3
    restart: unless-stopped
    ports:
      - '4566:4566'
    environment:
      SERVICES: sqs
      DEFAULT_REGION: us-east-1
      PERSISTENCE: 0
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/01-sqs.sh:ro
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ─── Prisma Migrate ──────────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-saas_backend}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # ─── Prisma Migrate (Legal Audit DB) ──────────────────────────────────────────
  migrate-legal:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.migrate
    command: npx prisma migrate deploy --config prisma.config.legal.ts
    environment:
      LEGAL_AUDIT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-legal:5432/${POSTGRES_LEGAL_DB:-saas_legal_audit}
    depends_on:
      postgres-legal:
        condition: service_healthy
    restart: on-failure

  # ─── API ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    restart: unless-stopped
    env_file: .env
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-saas_backend}
      LEGAL_AUDIT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-legal:5432/${POSTGRES_LEGAL_DB:-saas_legal_audit}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # --- SQS via LocalStack ---
      EVENT_BUS_TRANSPORT: sqs
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT_URL: http://localstack:4566
      SQS_STANDARD_QUEUE_URL: http://localstack:4566/000000000000/saas-backend-heavy-jobs
      SQS_FIFO_QUEUE_URL: http://localstack:4566/000000000000/saas-backend-billing-events.fifo
    depends_on:
      migrate:
        condition: service_completed_successfully
      migrate-legal:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

  # ─── Worker A ────────────────────────────────────────────────────────────────
  worker-a:
    build:
      context: .
      dockerfile: apps/worker-a/Dockerfile
      target: production
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-saas_backend}
      LEGAL_AUDIT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-legal:5432/${POSTGRES_LEGAL_DB:-saas_legal_audit}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # --- SQS via LocalStack ---
      EVENT_BUS_TRANSPORT: sqs
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT_URL: http://localstack:4566
      SQS_STANDARD_QUEUE_URL: http://localstack:4566/000000000000/saas-backend-heavy-jobs
      SQS_FIFO_QUEUE_URL: http://localstack:4566/000000000000/saas-backend-billing-events.fifo
    depends_on:
      migrate:
        condition: service_completed_successfully
      migrate-legal:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  postgres_data:
  postgres_legal_data:
  redis_data:
  localstack_data:
