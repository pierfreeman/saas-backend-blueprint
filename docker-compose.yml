services:
  # ─── Mailpit (local email catcher) ──────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP — set SMTP_HOST=localhost SMTP_PORT=1025 in .env
      - '8025:8025' # Web UI — open http://localhost:8025 to view emails

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-saas_backend}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-saas_backend}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── PostgreSQL (Legal Audit DB) ──────────────────────────────────────────────
  postgres-legal:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_LEGAL_DB:-saas_legal_audit}
    ports:
      - '${POSTGRES_LEGAL_PORT:-5434}:5432'
    volumes:
      - postgres_legal_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_LEGAL_DB:-saas_legal_audit}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_HOST_PORT:-6380}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── LocalStack (SQS, S3) ──────────────────────────────────────────────────────
  localstack:
    image: localstack/localstack:3
    restart: unless-stopped
    ports:
      - '4566:4566'
    environment:
      SERVICES: sqs,s3
      DEFAULT_REGION: us-east-1
      PERSISTENCE: 0
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/01-init.sh:ro
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ─── Prisma Migrate ──────────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-saas_backend}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # ─── Prisma Migrate (Legal Audit DB) ──────────────────────────────────────────
  migrate-legal:
    build:
      context: .
      target: migrate
    command: npx prisma migrate deploy --config prisma.config.legal.ts
    environment:
      LEGAL_AUDIT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-legal:5432/${POSTGRES_LEGAL_DB:-saas_legal_audit}
    depends_on:
      postgres-legal:
        condition: service_healthy
    restart: on-failure

  # ─── API ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: runtime
      args:
        APP_NAME: api
    restart: unless-stopped
    env_file: .env
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-saas_backend}
      LEGAL_AUDIT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-legal:5432/${POSTGRES_LEGAL_DB:-saas_legal_audit}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # --- SQS via LocalStack ---
      EVENT_BUS_TRANSPORT: sqs
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT_URL: http://localstack:4566
      SQS_STANDARD_QUEUE_URL: http://localstack:4566/000000000000/saas-backend-heavy-jobs
      SQS_FIFO_QUEUE_URL: http://localstack:4566/000000000000/saas-backend-billing-events.fifo
      # --- S3 via LocalStack ---
      AWS_S3_ENDPOINT: http://localstack:4566
      AWS_S3_PUBLIC_ENDPOINT: http://localhost:4566
      AWS_S3_BUCKET: saas-backend-storage
      # --- Email via Mailpit (dev) ---
      SMTP_HOST: mailpit
    depends_on:
      migrate:
        condition: service_completed_successfully
      migrate-legal:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

  # ─── Admin API ────────────────────────────────────────────────────────────────
  admin-api:
    build:
      context: .
      target: runtime
      args:
        APP_NAME: admin-api
    restart: unless-stopped
    env_file: .env
    ports:
      - '${ADMIN_API_PORT:-3001}:3001'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-saas_backend}
      LEGAL_AUDIT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-legal:5432/${POSTGRES_LEGAL_DB:-saas_legal_audit}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # --- Tighter rate limiting for admin endpoints ---
      RATE_LIMIT_MAX_PER_IP: 20
      RATE_LIMIT_MAX_PER_USER: 50
      RATE_LIMIT_TTL: 60
    depends_on:
      migrate:
        condition: service_completed_successfully
      migrate-legal:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ─── Worker A ────────────────────────────────────────────────────────────────
  worker-a:
    build:
      context: .
      target: runtime
      args:
        APP_NAME: worker-a
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-saas_backend}
      LEGAL_AUDIT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-legal:5432/${POSTGRES_LEGAL_DB:-saas_legal_audit}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # --- SQS via LocalStack ---
      EVENT_BUS_TRANSPORT: sqs
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT_URL: http://localstack:4566
      SQS_STANDARD_QUEUE_URL: http://localstack:4566/000000000000/saas-backend-heavy-jobs
      SQS_FIFO_QUEUE_URL: http://localstack:4566/000000000000/saas-backend-billing-events.fifo
      SMTP_HOST: mailpit
      AWS_S3_ENDPOINT: http://localstack:4566
      AWS_S3_PUBLIC_ENDPOINT: http://localhost:4566
    depends_on:
      migrate:
        condition: service_completed_successfully
      migrate-legal:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

  # ─── Stripe CLI (webhook forwarder — dev only) ───────────────────────────────
  # Forwards Stripe test events to the local API container.
  # The signing secret is deterministic per STRIPE_SECRET_KEY and matches the
  # STRIPE_WEBHOOK_SECRET value in .env (run `docker run --rm stripe/stripe-cli
  # listen --print-secret --api-key <key>` to regenerate it).
  stripe-cli:
    image: stripe/stripe-cli
    command: >
      listen
      --forward-to http://api:3000/billing/webhook
      --events checkout.session.completed,customer.subscription.created,customer.subscription.updated,invoice.payment_succeeded,invoice.payment_failed
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_DEVICE_NAME: saas-local
    depends_on:
      - api
    restart: on-failure

volumes:
  postgres_data:
  postgres_legal_data:
  redis_data:
  localstack_data:
